<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>RecipeHub</h1>
        <p>Find something delicious 😋</p>
    </header>
    <div class="search">
        <input id="searchInput" type="text" placeholder="Search for something delicious">
        <button onclick="searchRecipe()">Search</button>
    </div>
    <button class="random" onclick="randomRecipe()">
        Random Recipe
    </button>
    <div class="categories">
        <button onclick="loadCategory('Chicken')">Chicken</button>
        <button onclick="loadCategory('Beef')">Beef</button>
        <button onclick="loadCategory('Vegetarian')">Sea Food</button>
        <button onclick="loadCategory('Dessert')">Dessert</button>
    </div>
        <p id="message">Loading recipes..</p>
        <main id="recipes"></main>
        <div class="item" id="item">
            <div class="item-box">
                <div class="item-content">
                    <button class="close" onclick="closeRecipe()">Close</button>
                    <div id="details"></div>
                </div>
            </div>
        </div>
    <footer>
        Recipes from TheMealDB api
    </footer>
    <script src="script.js"></script>
</body>
</html>
